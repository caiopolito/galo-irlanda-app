# Postgres local para desenvolvimento da API (docker compose up -d)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: galo
      POSTGRES_USER: galo
      POSTGRES_PASSWORD: galo
    ports:
      - "5432:5432"
    volumes:
      - galo-db:/var/lib/postgresql/data

volumes:
  galo-db:
